name: Build OpenLP+

on:
  repository_dispatch:
    types: [upstream-release]
  workflow_dispatch:
    inputs:
      openlp_tag:
        description: "openlp-plus tag to build (blank = latest release)"
        required: false
        default: ""
      create_release:
        description: "Create an openlp-packaging release with the artifacts"
        required: false
        default: "true"
      build_macos:
        description: "Build the macOS .dmg (requires a runner labelled macos)"
        required: false
        default: "true"
      build_windows:
        description: "Build the Windows .msi / portable (requires a runner labelled windows)"
        required: false
        default: "true"
      build_flatpak:
        description: "Build the Linux Flatpak (requires a runner labelled flatpak-builder)"
        required: false
        default: "false"

env:
  PLUS_REPO: tbcproductions/openlp-plus

jobs:
  prepare-source:
    name: Resolve openlp-plus tag
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm-slim
    outputs:
      plus_tag: ${{ steps.resolve.outputs.plus_tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl jq ca-certificates

      - name: Resolve tag
        id: resolve
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          PLUS_TAG="${{ github.event.client_payload.tag || github.event.inputs.openlp_tag || '' }}"
          if [ -z "$PLUS_TAG" ]; then
            PLUS_TAG="$(curl -fsSL -H "Authorization: token ${CI_TOKEN}" \
              "${GITHUB_SERVER_URL}/api/v1/repos/${PLUS_REPO}/releases/latest" | jq -r .tag_name)"
          fi
          echo "plus_tag=$PLUS_TAG"    | tee -a "$GITHUB_OUTPUT"
          echo "version=${PLUS_TAG#v}" | tee -a "$GITHUB_OUTPUT"

  build-flatpak:
    name: Build Flatpak (Linux)
    needs: prepare-source
    if: ${{ github.event.inputs.build_flatpak == 'true' || github.event.client_payload.build_flatpak == true }}
    runs-on: flatpak-builder
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-46
      options: --privileged
    steps:
      - name: Check out packaging repo
        uses: actions/checkout@v4

      - name: Check out openlp-plus at tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PLUS_REPO }}
          ref: ${{ needs.prepare-source.outputs.plus_tag }}
          path: source
          token: ${{ secrets.CI_TOKEN }}

      - name: Stamp version file
        run: |
          echo -n "${{ needs.prepare-source.outputs.version }}" > source/openlp/.version

      - name: Build Flatpak
        run: |
          mkdir -p dist
          python3 builders/flatpak-builder.py \
            --branch "$(pwd)/source" \
            "${{ needs.prepare-source.outputs.version }}"

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v3
        with:
          name: openlp-flatpak
          path: dist/*.flatpak
          retention-days: 14
          if-no-files-found: warn

  build-macos:
    name: Build macOS (.dmg)
    needs: prepare-source
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_macos != 'false') || (github.event_name == 'repository_dispatch' && github.event.client_payload.build_macos != false) }}
    runs-on: macos
    steps:
      - name: Check out packaging repo
        uses: actions/checkout@v4

      - name: Check out openlp-plus at tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PLUS_REPO }}
          ref: ${{ needs.prepare-source.outputs.plus_tag }}
          path: source
          token: ${{ secrets.CI_TOKEN }}

      - name: Stamp version file
        run: |
          echo -n "${{ needs.prepare-source.outputs.version }}" > source/openlp/.version

      - name: Install runtime deps
        run: |
          brew install python@3.14 icu4c enchant pkg-config || true
          PY=/opt/homebrew/opt/python@3.14/bin/python3.14
          export PATH="/opt/homebrew/opt/python@3.14/bin:/opt/homebrew/opt/icu4c/bin:/opt/homebrew/opt/icu4c/sbin:$PATH"
          export PKG_CONFIG_PATH="/opt/homebrew/opt/icu4c/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          "$PY" -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install pyinstaller dmgbuild macholib py-applescript Pyro5
          .venv/bin/python -m pip install -e 'source/.[darkstyle,mysql,odbc,postgresql,spellcheck,sword-bibles]'

      - name: Run macOS builder
        env:
          PYENCHANT_LIBRARY_PATH: /opt/homebrew/lib/libenchant-2.2.dylib
        run: |
          export PATH="$(pwd)/.venv/bin:/opt/homebrew/opt/python@3.14/bin:/opt/homebrew/opt/icu4c/bin:/opt/homebrew/opt/icu4c/sbin:$PATH"
          .venv/bin/python builders/macos-builder.py \
            --release "${{ needs.prepare-source.outputs.plus_tag }}" \
            --skip-update \
            --config macos/config-gitlab.ini \
            --branch "$(pwd)/source"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v3
        with:
          name: openlp-macos
          path: dist/*.dmg
          retention-days: 14
          if-no-files-found: warn

  build-windows:
    name: Build Windows (.msi / portable)
    needs: prepare-source
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_windows != 'false') || (github.event_name == 'repository_dispatch' && github.event.client_payload.build_windows != false) }}
    runs-on: windows
    steps:
      - name: Check out packaging repo
        uses: actions/checkout@v4

      - name: Check out openlp-plus at tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PLUS_REPO }}
          ref: ${{ needs.prepare-source.outputs.plus_tag }}
          path: source
          token: ${{ secrets.CI_TOKEN }}

      - name: Stamp version file
        shell: bash
        run: |
          printf '%s' "${{ needs.prepare-source.outputs.version }}" > source/openlp/.version

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install runtime deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pyodbc pypiwin32
          python -m pip install https://github.com/cgohlke/pyicu-build/releases/download/v2.16.2/pyicu-2.16.2-cp314-cp314-win_amd64.whl
          python -m pip install -e 'source/.[darkstyle,mysql,odbc,postgresql,spellcheck,sword-bibles]'

      - name: Run Windows builder
        shell: bash
        run: |
          python builders/windows-builder.py \
            --verbose \
            --release "${{ needs.prepare-source.outputs.plus_tag }}" \
            --skip-update \
            --config windows/config-gitlab.ini \
            --branch "$(pwd)/source" \
            --portable

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v3
        with:
          name: openlp-windows
          path: |
            dist/*.msi
            dist/*.exe
          retention-days: 14
          if-no-files-found: warn

  publish-release:
    name: Publish openlp-packaging release
    needs: [prepare-source, build-macos, build-windows]
    if: >-
      always()
      && needs.prepare-source.result == 'success'
      && (github.event_name == 'repository_dispatch' || github.event.inputs.create_release == 'true')
      && (needs.build-macos.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm-slim
    steps:
      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl jq ca-certificates

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Create release and upload assets
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          PLUS_TAG: ${{ needs.prepare-source.outputs.plus_tag }}
        run: |
          set -e
          TAG="build-${PLUS_TAG}-$(date -u +%Y%m%d%H%M%S)"
          NAME="OpenLP+ ${PLUS_TAG}"
          BODY=$(jq -n \
            --arg tag "$TAG" \
            --arg name "$NAME" \
            --arg body "Built from openlp-plus @ ${PLUS_TAG}." \
            '{tag_name:$tag, name:$name, body:$body, draft:false, prerelease:false, target_commitish:"main"}')

          RELEASE_ID=$(curl -fsSL -X POST \
            -H "Authorization: token ${CI_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases" | jq -r .id)

          echo "Release ID: $RELEASE_ID"

          find artifacts -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.flatpak' \) \
            | while read -r asset; do
            echo "Uploading $asset"
            curl -fsSL -X POST \
              -H "Authorization: token ${CI_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$asset" \
              "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=$(basename "$asset")"
          done
