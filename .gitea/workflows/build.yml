name: Build Opal Presenter

on:
  repository_dispatch:
    types: [upstream-release]
  workflow_dispatch:
    inputs:
      opal_tag:
        description: "opal-presenter tag to build (blank = latest release)"
        required: false
        default: ""
      openlp_tag:
        description: "Legacy tag input; use opal_tag for new dispatches"
        required: false
        default: ""
      create_release:
        description: "Attach artifacts to the release on the configured repo (see .gitea/release-repo)"
        required: false
        default: "true"
      build_macos:
        description: "Build the macOS .dmg (requires a runner labelled macos)"
        required: false
        default: "true"
      build_windows:
        description: "Build the Windows .msi / portable (requires a runner labelled windows)"
        required: false
        default: "true"
      build_flatpak:
        description: "Build the Linux Flatpak (requires a runner labelled flatpak-builder)"
        required: false
        default: "false"

env:
  OPAL_REPO: tbcproductions/opal-presenter

defaults:
  run:
    shell: bash

jobs:
  prepare-source:
    name: Resolve opal-presenter tag
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm-slim
    outputs:
      opal_tag: ${{ steps.resolve.outputs.opal_tag }}
      version: ${{ steps.resolve.outputs.version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_id: ${{ steps.release.outputs.release_id }}
      release_existed: ${{ steps.release.outputs.release_existed }}
      release_repo: ${{ steps.target.outputs.release_repo }}
      create_release: ${{ steps.release.outputs.create_release }}
    steps:
      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl jq ca-certificates git

      - name: Check out packaging repo
        uses: actions/checkout@v4

      - name: Load release target
        id: target
        run: |
          set -e
          REPO=$(tr -d '[:space:]' < .gitea/release-repo)
          if [ -z "$REPO" ]; then
            echo "::error::.gitea/release-repo is empty"
            exit 1
          fi
          echo "release_repo=$REPO" | tee -a "$GITHUB_OUTPUT"

      - name: Resolve tag
        id: resolve
        shell: bash
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          OPAL_TAG: ${{ github.event.client_payload.tag || github.event.inputs.opal_tag || github.event.inputs.openlp_tag || '' }}
        run: |
          set -euo pipefail
          if [ -z "$OPAL_TAG" ]; then
            echo "No tag supplied, asking ${OPAL_REPO} for its latest release"
            HTTP=$(curl -sS -o /tmp/latest.json -w '%{http_code}' \
              -H "Authorization: token ${CI_TOKEN}" \
              "${GITHUB_SERVER_URL}/api/v1/repos/${OPAL_REPO}/releases/latest")
            if [ "$HTTP" != "200" ]; then
              echo "::error::Could not query ${OPAL_REPO}/releases/latest (HTTP $HTTP)"
              cat /tmp/latest.json || true
              exit 1
            fi
            OPAL_TAG="$(jq -r '.tag_name // empty' /tmp/latest.json)"
          fi
          if [ -z "$OPAL_TAG" ] || [ "$OPAL_TAG" = "null" ]; then
            echo "::error::Failed to resolve an opal-presenter tag. Re-run the workflow with a non-empty 'opal_tag' input, or publish a release on ${OPAL_REPO}."
            exit 1
          fi
          echo "Resolved opal-presenter tag: $OPAL_TAG"
          echo "opal_tag=$OPAL_TAG"    | tee -a "$GITHUB_OUTPUT"
          echo "version=${OPAL_TAG#v}" | tee -a "$GITHUB_OUTPUT"

      - name: Resolve or create release
        id: release
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          OPAL_TAG: ${{ steps.resolve.outputs.opal_tag }}
          RELEASE_REPO: ${{ steps.target.outputs.release_repo }}
        run: |
          set -e
          CREATE_RELEASE="${{ github.event_name == 'repository_dispatch' && 'true' || github.event.inputs.create_release }}"
          echo "create_release=$CREATE_RELEASE" | tee -a "$GITHUB_OUTPUT"
          if [ "$CREATE_RELEASE" != "true" ]; then
            echo "Release handling disabled, skipping"
            exit 0
          fi

          HTTP=$(curl -sS -o /tmp/release.json -w '%{http_code}' \
            -H "Authorization: token ${CI_TOKEN}" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${RELEASE_REPO}/releases/tags/${OPAL_TAG}")

          if [ "$HTTP" = "200" ]; then
            RELEASE_ID=$(jq -r .id /tmp/release.json)
            echo "Reusing existing release $RELEASE_ID at tag ${OPAL_TAG}"
            echo "release_tag=${OPAL_TAG}"     | tee -a "$GITHUB_OUTPUT"
            echo "release_id=$RELEASE_ID"      | tee -a "$GITHUB_OUTPUT"
            echo "release_existed=true"        | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$HTTP" != "404" ]; then
            echo "::error::Unexpected HTTP $HTTP looking up release at tag ${OPAL_TAG}"
            cat /tmp/release.json || true
            exit 1
          fi

          echo "No existing release for tag ${OPAL_TAG}, creating draft"
          NAME="Opal Presenter ${OPAL_TAG}"
          BODY=$(jq -n \
            --arg tag "$OPAL_TAG" \
            --arg name "$NAME" \
            --arg body "Built from opal-presenter @ ${OPAL_TAG}." \
            '{tag_name:$tag, name:$name, body:$body, draft:true, prerelease:false}')

          RELEASE_ID=$(curl -fsSL -X POST \
            -H "Authorization: token ${CI_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${RELEASE_REPO}/releases" | jq -r .id)

          echo "release_tag=${OPAL_TAG}" | tee -a "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID"  | tee -a "$GITHUB_OUTPUT"
          echo "release_existed=false"   | tee -a "$GITHUB_OUTPUT"

  build-flatpak:
    name: Build Flatpak (Linux)
    needs: prepare-source
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_flatpak == 'true') || (github.event_name == 'repository_dispatch' && github.event.client_payload.build_flatpak == true) }}
    # Let an online runner mark disabled builds skipped.
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && github.event.inputs.build_flatpak == 'true') || (github.event_name == 'repository_dispatch' && github.event.client_payload.build_flatpak == true)) && 'flatpak-builder' || 'ubuntu-latest' }}
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-46
      options: --privileged
    steps:
      - name: Check out packaging repo
        uses: actions/checkout@v4

      - name: Check out opal-presenter at tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OPAL_REPO }}
          ref: ${{ needs.prepare-source.outputs.opal_tag }}
          path: source
          token: ${{ secrets.CI_TOKEN }}
          fetch-depth: 0
          fetch-tags: true

      - name: Stamp version file
        run: |
          echo -n "${{ needs.prepare-source.outputs.version }}" > source/openlp/.version

      - name: Build Flatpak
        run: |
          python3 builders/flatpak-builder.py \
            --branch "$(pwd)/source" \
            "${{ needs.prepare-source.outputs.version }}"

      - name: Upload Flatpak assets to release
        if: ${{ needs.prepare-source.outputs.create_release == 'true' && needs.prepare-source.outputs.release_id != '' }}
        shell: bash
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-source.outputs.release_id }}
          RELEASE_REPO: ${{ needs.prepare-source.outputs.release_repo }}
          ORIGIN_IP: ${{ secrets.ORIGIN_IP }}
        run: |
          set -e
          shopt -s nullglob
          found=0
          for asset in flatpak/*.flatpak; do
            found=1
            bash .gitea/scripts/upload-release-asset.sh "$asset"
          done
          if [ "$found" = "0" ]; then
            echo "::error::No Flatpak assets found in flatpak/"; exit 1
          fi

  build-macos:
    name: Build macOS (.dmg)
    needs: prepare-source
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_macos != 'false') || (github.event_name == 'repository_dispatch' && github.event.client_payload.build_macos != false) }}
    # Let an online runner mark disabled builds skipped.
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && github.event.inputs.build_macos != 'false') || (github.event_name == 'repository_dispatch' && github.event.client_payload.build_macos != false)) && 'macos' || 'ubuntu-latest' }}
    steps:
      - name: Check out packaging repo
        uses: actions/checkout@v4

      - name: Check out opal-presenter at tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OPAL_REPO }}
          ref: ${{ needs.prepare-source.outputs.opal_tag }}
          path: source
          token: ${{ secrets.CI_TOKEN }}
          fetch-depth: 0
          fetch-tags: true

      - name: Stamp version file
        run: |
          echo -n "${{ needs.prepare-source.outputs.version }}" > source/openlp/.version

      - name: Install runtime deps
        run: |
          brew install python@3.14 icu4c enchant pkg-config libpq || true
          PY=/opt/homebrew/opt/python@3.14/bin/python3.14
          export PATH="/opt/homebrew/opt/python@3.14/bin:/opt/homebrew/opt/icu4c/bin:/opt/homebrew/opt/icu4c/sbin:/opt/homebrew/opt/libpq/bin:$PATH"
          export PKG_CONFIG_PATH="/opt/homebrew/opt/icu4c/lib/pkgconfig:/opt/homebrew/opt/libpq/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          "$PY" -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install pyinstaller dmgbuild macholib py-applescript Pyro5
          if [ -f source/scripts/build_fluentqt.py ]; then
            .venv/bin/python -m pip install cmake ninja aqtinstall "PySide6==6.11.1" "shiboken6_generator==6.11.1"
            .venv/bin/python -m aqt install-qt mac desktop 6.11.1 clang_64 --archives qtbase -O .cache/qt
            .venv/bin/python source/scripts/build_fluentqt.py --qt-prefix .cache/qt/6.11.1/macos --install
          fi
          .venv/bin/python -m pip install -e 'source/.[darkstyle,mysql,odbc,postgresql,spellcheck,sword-bibles]'

      - name: Run macOS builder
        env:
          PYENCHANT_LIBRARY_PATH: /opt/homebrew/lib/libenchant-2.2.dylib
          PYTHONUNBUFFERED: "1"
        run: |
          export PATH="$(pwd)/.venv/bin:/opt/homebrew/opt/python@3.14/bin:/opt/homebrew/opt/icu4c/bin:/opt/homebrew/opt/icu4c/sbin:$PATH"
          .venv/bin/python -u builders/macos-builder.py \
            --release "${{ needs.prepare-source.outputs.opal_tag }}" \
            --skip-update \
            --config macos/config-gitlab.ini \
            --branch "$(pwd)/source"

      - name: Upload macOS assets to release
        if: ${{ needs.prepare-source.outputs.create_release == 'true' && needs.prepare-source.outputs.release_id != '' }}
        shell: bash
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-source.outputs.release_id }}
          RELEASE_REPO: ${{ needs.prepare-source.outputs.release_repo }}
          ORIGIN_IP: ${{ secrets.ORIGIN_IP }}
        run: |
          set -e
          shopt -s nullglob
          found=0
          for asset in source/dist/*.dmg; do
            found=1
            bash .gitea/scripts/upload-release-asset.sh "$asset"
          done
          if [ "$found" = "0" ]; then
            echo "::error::No macOS assets found in source/dist/"; exit 1
          fi

  build-windows:
    name: Build Windows (.msi / portable)
    env:
      PYTHONUTF8: '1'
    needs: prepare-source
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_windows != 'false') || (github.event_name == 'repository_dispatch' && github.event.client_payload.build_windows != false) }}
    # Let an online runner mark disabled builds skipped.
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && github.event.inputs.build_windows != 'false') || (github.event_name == 'repository_dispatch' && github.event.client_payload.build_windows != false)) && 'windows' || 'ubuntu-latest' }}
    steps:
      - name: Check out packaging repo
        uses: actions/checkout@v4

      - name: Check out opal-presenter at tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OPAL_REPO }}
          ref: ${{ needs.prepare-source.outputs.opal_tag }}
          path: source
          token: ${{ secrets.CI_TOKEN }}
          fetch-depth: 0
          fetch-tags: true

      - name: Stamp version file
        shell: powershell
        run: |
          [System.IO.File]::WriteAllText("source/openlp/.version", "${{ needs.prepare-source.outputs.version }}")

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install runtime deps
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pyodbc pypiwin32
          python -m pip install https://github.com/cgohlke/pyicu-build/releases/download/v2.16.2/pyicu-2.16.2-cp314-cp314-win_amd64.whl
          if (Test-Path source/scripts/build_fluentqt.py) {
            # Build tools must be adjacent to the build interpreter. Keep the
            # builder's existing system interpreter and install the wheel there.
            python -m venv .cache/fluentqt-build-env
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $buildPython = '.cache/fluentqt-build-env/Scripts/python.exe'
            # Qt 6.11 Windows repositories are split by compiler; PyPI 3.3.0 uses the old layout.
            & $buildPython -m pip install cmake ninja "aqtinstall @ git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7" "PySide6==6.11.1" "shiboken6_generator==6.11.1"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $buildPython -m aqt install-qt windows desktop 6.11.1 win64_msvc2022_64 --archives qtbase -O .cache/qt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $buildPython source/scripts/build_fluentqt.py --qt-prefix .cache/qt/6.11.1/msvc2022_64
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python -m pip install --find-links .cache/fluentqt/wheelhouse -e "source/.[darkstyle,mysql,odbc,postgresql,spellcheck,sword-bibles]"
          exit $LASTEXITCODE

      - name: Run Windows builder
        shell: powershell
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u builders/windows-builder.py `
            --release "${{ needs.prepare-source.outputs.opal_tag }}" `
            --skip-update `
            --config windows/config-gitea.ini `
            --branch "$(Get-Location)/source" `
            --portable

      - name: Upload Windows assets to release
        if: ${{ needs.prepare-source.outputs.create_release == 'true' && needs.prepare-source.outputs.release_id != '' }}
        shell: powershell
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-source.outputs.release_id }}
          RELEASE_REPO: ${{ needs.prepare-source.outputs.release_repo }}
          ORIGIN_IP: ${{ secrets.ORIGIN_IP }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @(Get-ChildItem -Path source/dist -Filter *.msi -ErrorAction SilentlyContinue) +
                    @(Get-ChildItem -Path source/dist -Filter *.exe -ErrorAction SilentlyContinue)
          if ($assets.Count -eq 0) {
            Write-Host "::error::No Windows assets found in source/dist/"
            exit 1
          }
          $base = "$env:GITHUB_SERVER_URL/api/v1/repos/$env:RELEASE_REPO/releases/$env:RELEASE_ID/assets"
          $authHeader = "Authorization: token $env:CI_TOKEN"
          # Build optional ORIGIN_IP bypass args (mirrors the bash upload script)
          $bypassArgs = @()
          if ($env:ORIGIN_IP) {
            $host_ = ($env:GITHUB_SERVER_URL -replace '^https?://', '') -replace '/.*', ''
            $urlPort = if ($env:GITHUB_SERVER_URL -match '^https') { '443' } else { '80' }
            if ($env:ORIGIN_IP -match ':') {
              $originIp   = $env:ORIGIN_IP -replace ':.*', ''
              $originPort = $env:ORIGIN_IP -replace '.*:', ''
            } else {
              $originIp   = $env:ORIGIN_IP
              $originPort = $urlPort
            }
            $bypassArgs = @('--connect-to', "${host_}:${urlPort}:${originIp}:${originPort}", '-k')
            Write-Host "Bypassing proxy via ${host_}:${urlPort} -> ${originIp}:${originPort} (TLS verification disabled)"
          }
          foreach ($asset in $assets) {
            $assetName = $asset.Name
            Write-Host "Uploading $($asset.FullName)"
            # Delete existing asset with same name if present
            $listJson = curl.exe -fsSL @bypassArgs -H $authHeader $base
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $existing = ($listJson | ConvertFrom-Json) | Where-Object { $_.name -eq $assetName }
            if ($existing) {
              Write-Host "Deleting existing asset $assetName (id=$($existing.id))"
              curl.exe -fsSL @bypassArgs -X DELETE -H $authHeader "$base/$($existing.id)"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            # Upload new asset
            curl.exe -fsSL @bypassArgs -X POST `
              -H $authHeader `
              -H "Content-Type: application/octet-stream" `
              --data-binary "@$($asset.FullName)" `
              "$($base)?name=$assetName"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  publish-release:
    name: Publish opal-presenter-packaging release
    needs: [prepare-source, build-macos, build-windows, build-flatpak]
    if: >-
      always()
      && needs.prepare-source.result == 'success'
      && needs.prepare-source.outputs.create_release == 'true'
      && needs.prepare-source.outputs.release_id != ''
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm-slim
    steps:
      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl jq ca-certificates

      - name: Publish completed draft release
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-source.outputs.release_id }}
          RELEASE_REPO: ${{ needs.prepare-source.outputs.release_repo }}
          MACOS_RESULT: ${{ needs.build-macos.result }}
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
          FLATPAK_RESULT: ${{ needs.build-flatpak.result }}
        run: |
          set -e
          ANY_SUCCESS=0
          for r in "$MACOS_RESULT" "$WINDOWS_RESULT" "$FLATPAK_RESULT"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::A requested build failed; retaining the draft release for inspection"
              exit 1
            fi
            [ "$r" = "success" ] && ANY_SUCCESS=1
          done

          if [ "$ANY_SUCCESS" = "0" ]; then
            echo "::warning::No builds succeeded; retaining the draft release"
            exit 1
          fi
          IS_DRAFT=$(curl -fsSL -H "Authorization: token ${CI_TOKEN}" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${RELEASE_REPO}/releases/${RELEASE_ID}" | jq -r .draft)
          if [ "$IS_DRAFT" = "false" ]; then
            echo "Release $RELEASE_ID is already published; leaving it untouched"
            exit 0
          fi
          if [ "$IS_DRAFT" != "true" ]; then
            echo "::error::Could not confirm the release is a draft"
            exit 1
          fi

          echo "Publishing draft release $RELEASE_ID"
          curl -fsSL -X PATCH \
            -H "Authorization: token ${CI_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"draft":false}' \
            "${GITHUB_SERVER_URL}/api/v1/repos/${RELEASE_REPO}/releases/${RELEASE_ID}" \
            | jq -r '"Release URL: \(.html_url)"'
