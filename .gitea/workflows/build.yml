name: Build OpenLP+

on:
  repository_dispatch:
    types: [upstream-release]
  workflow_dispatch:
    inputs:
      openlp_tag:
        description: "openlp-plus tag to build (blank = latest release)"
        required: false
        default: ""
      create_release:
        description: "Attach artifacts to the release on the configured repo (see .gitea/release-repo)"
        required: false
        default: "true"
      build_macos:
        description: "Build the macOS .dmg (requires a runner labelled macos)"
        required: false
        default: "true"
      build_windows:
        description: "Build the Windows .msi / portable (requires a runner labelled windows)"
        required: false
        default: "true"
      build_flatpak:
        description: "Build the Linux Flatpak (requires a runner labelled flatpak-builder)"
        required: false
        default: "false"

env:
  PLUS_REPO: tbcproductions/openlp-plus

jobs:
  prepare-source:
    name: Resolve openlp-plus tag
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm-slim
    outputs:
      plus_tag: ${{ steps.resolve.outputs.plus_tag }}
      version: ${{ steps.resolve.outputs.version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_id: ${{ steps.release.outputs.release_id }}
      release_existed: ${{ steps.release.outputs.release_existed }}
      release_repo: ${{ steps.target.outputs.release_repo }}
      create_release: ${{ steps.release.outputs.create_release }}
    steps:
      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl jq ca-certificates git

      - name: Check out packaging repo
        uses: actions/checkout@v4

      - name: Load release target
        id: target
        run: |
          set -e
          REPO=$(tr -d '[:space:]' < .gitea/release-repo)
          if [ -z "$REPO" ]; then
            echo "::error::.gitea/release-repo is empty"
            exit 1
          fi
          echo "release_repo=$REPO" | tee -a "$GITHUB_OUTPUT"

      - name: Resolve tag
        id: resolve
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          PLUS_TAG="${{ github.event.client_payload.tag || github.event.inputs.openlp_tag || '' }}"
          if [ -z "$PLUS_TAG" ]; then
            PLUS_TAG="$(curl -fsSL -H "Authorization: token ${CI_TOKEN}" \
              "${GITHUB_SERVER_URL}/api/v1/repos/${PLUS_REPO}/releases/latest" | jq -r .tag_name)"
          fi
          echo "plus_tag=$PLUS_TAG"    | tee -a "$GITHUB_OUTPUT"
          echo "version=${PLUS_TAG#v}" | tee -a "$GITHUB_OUTPUT"

      - name: Resolve or create release
        id: release
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          PLUS_TAG: ${{ steps.resolve.outputs.plus_tag }}
          RELEASE_REPO: ${{ steps.target.outputs.release_repo }}
        run: |
          set -e
          CREATE_RELEASE="${{ github.event_name == 'repository_dispatch' && 'true' || github.event.inputs.create_release }}"
          echo "create_release=$CREATE_RELEASE" | tee -a "$GITHUB_OUTPUT"
          if [ "$CREATE_RELEASE" != "true" ]; then
            echo "Release handling disabled, skipping"
            exit 0
          fi

          HTTP=$(curl -sS -o /tmp/release.json -w '%{http_code}' \
            -H "Authorization: token ${CI_TOKEN}" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${RELEASE_REPO}/releases/tags/${PLUS_TAG}")

          if [ "$HTTP" = "200" ]; then
            RELEASE_ID=$(jq -r .id /tmp/release.json)
            echo "Reusing existing release $RELEASE_ID at tag ${PLUS_TAG}"
            echo "release_tag=${PLUS_TAG}"     | tee -a "$GITHUB_OUTPUT"
            echo "release_id=$RELEASE_ID"      | tee -a "$GITHUB_OUTPUT"
            echo "release_existed=true"        | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$HTTP" != "404" ]; then
            echo "::error::Unexpected HTTP $HTTP looking up release at tag ${PLUS_TAG}"
            cat /tmp/release.json || true
            exit 1
          fi

          echo "No existing release for tag ${PLUS_TAG}, creating draft"
          NAME="OpenLP+ ${PLUS_TAG}"
          BODY=$(jq -n \
            --arg tag "$PLUS_TAG" \
            --arg name "$NAME" \
            --arg body "Built from openlp-plus @ ${PLUS_TAG}." \
            '{tag_name:$tag, name:$name, body:$body, draft:true, prerelease:false}')

          RELEASE_ID=$(curl -fsSL -X POST \
            -H "Authorization: token ${CI_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${RELEASE_REPO}/releases" | jq -r .id)

          echo "release_tag=${PLUS_TAG}" | tee -a "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID"  | tee -a "$GITHUB_OUTPUT"
          echo "release_existed=false"   | tee -a "$GITHUB_OUTPUT"

  build-flatpak:
    name: Build Flatpak (Linux)
    needs: prepare-source
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_flatpak == 'true') || (github.event_name == 'repository_dispatch' && github.event.client_payload.build_flatpak == true) }}
    runs-on: flatpak-builder
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-46
      options: --privileged
    steps:
      - name: Check out packaging repo
        uses: actions/checkout@v4

      - name: Check out openlp-plus at tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PLUS_REPO }}
          ref: ${{ needs.prepare-source.outputs.plus_tag }}
          path: source
          token: ${{ secrets.CI_TOKEN }}

      - name: Stamp version file
        run: |
          echo -n "${{ needs.prepare-source.outputs.version }}" > source/openlp/.version

      - name: Build Flatpak
        run: |
          python3 builders/flatpak-builder.py \
            --branch "$(pwd)/source" \
            "${{ needs.prepare-source.outputs.version }}"

      - name: Upload Flatpak assets to release
        if: ${{ needs.prepare-source.outputs.create_release == 'true' && needs.prepare-source.outputs.release_id != '' }}
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-source.outputs.release_id }}
          RELEASE_REPO: ${{ needs.prepare-source.outputs.release_repo }}
        run: |
          set -e
          shopt -s nullglob
          found=0
          for asset in flatpak/*.flatpak; do
            found=1
            bash .gitea/scripts/upload-release-asset.sh "$asset"
          done
          if [ "$found" = "0" ]; then
            echo "::warning::No Flatpak assets found in flatpak/"
          fi

  build-macos:
    name: Build macOS (.dmg)
    needs: prepare-source
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_macos != 'false') || (github.event_name == 'repository_dispatch' && github.event.client_payload.build_macos != false) }}
    runs-on: macos
    steps:
      - name: Check out packaging repo
        uses: actions/checkout@v4

      - name: Check out openlp-plus at tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PLUS_REPO }}
          ref: ${{ needs.prepare-source.outputs.plus_tag }}
          path: source
          token: ${{ secrets.CI_TOKEN }}

      - name: Stamp version file
        run: |
          echo -n "${{ needs.prepare-source.outputs.version }}" > source/openlp/.version

      - name: Install runtime deps
        run: |
          brew install python@3.14 icu4c enchant pkg-config || true
          PY=/opt/homebrew/opt/python@3.14/bin/python3.14
          export PATH="/opt/homebrew/opt/python@3.14/bin:/opt/homebrew/opt/icu4c/bin:/opt/homebrew/opt/icu4c/sbin:$PATH"
          export PKG_CONFIG_PATH="/opt/homebrew/opt/icu4c/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          "$PY" -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install pyinstaller dmgbuild macholib py-applescript Pyro5
          .venv/bin/python -m pip install -e 'source/.[darkstyle,mysql,odbc,postgresql,spellcheck,sword-bibles]'

      - name: Run macOS builder
        env:
          PYENCHANT_LIBRARY_PATH: /opt/homebrew/lib/libenchant-2.2.dylib
        run: |
          export PATH="$(pwd)/.venv/bin:/opt/homebrew/opt/python@3.14/bin:/opt/homebrew/opt/icu4c/bin:/opt/homebrew/opt/icu4c/sbin:$PATH"
          .venv/bin/python builders/macos-builder.py \
            --release "${{ needs.prepare-source.outputs.plus_tag }}" \
            --skip-update \
            --config macos/config-gitlab.ini \
            --branch "$(pwd)/source"

      - name: Upload macOS assets to release
        if: ${{ needs.prepare-source.outputs.create_release == 'true' && needs.prepare-source.outputs.release_id != '' }}
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-source.outputs.release_id }}
          RELEASE_REPO: ${{ needs.prepare-source.outputs.release_repo }}
        run: |
          set -e
          shopt -s nullglob
          found=0
          for asset in source/dist/*.dmg; do
            found=1
            bash .gitea/scripts/upload-release-asset.sh "$asset"
          done
          if [ "$found" = "0" ]; then
            echo "::warning::No macOS assets found in source/dist/"
          fi

  build-windows:
    name: Build Windows (.msi / portable)
    needs: prepare-source
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_windows != 'false') || (github.event_name == 'repository_dispatch' && github.event.client_payload.build_windows != false) }}
    runs-on: windows
    steps:
      - name: Check out packaging repo
        uses: actions/checkout@v4

      - name: Check out openlp-plus at tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PLUS_REPO }}
          ref: ${{ needs.prepare-source.outputs.plus_tag }}
          path: source
          token: ${{ secrets.CI_TOKEN }}

      - name: Stamp version file
        shell: bash
        run: |
          printf '%s' "${{ needs.prepare-source.outputs.version }}" > source/openlp/.version

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install runtime deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pyodbc pypiwin32
          python -m pip install https://github.com/cgohlke/pyicu-build/releases/download/v2.16.2/pyicu-2.16.2-cp314-cp314-win_amd64.whl
          python -m pip install -e 'source/.[darkstyle,mysql,odbc,postgresql,spellcheck,sword-bibles]'

      - name: Run Windows builder
        shell: bash
        run: |
          python builders/windows-builder.py \
            --release "${{ needs.prepare-source.outputs.plus_tag }}" \
            --skip-update \
            --config windows/config-gitea.ini \
            --branch "$(pwd)/source" \
            --portable

      - name: Upload Windows assets to release
        if: ${{ needs.prepare-source.outputs.create_release == 'true' && needs.prepare-source.outputs.release_id != '' }}
        shell: bash
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-source.outputs.release_id }}
          RELEASE_REPO: ${{ needs.prepare-source.outputs.release_repo }}
        run: |
          set -e
          shopt -s nullglob
          found=0
          for asset in source/dist/*.msi source/dist/*.exe; do
            found=1
            bash .gitea/scripts/upload-release-asset.sh "$asset"
          done
          if [ "$found" = "0" ]; then
            echo "::warning::No Windows assets found in source/dist/"
          fi

  publish-release:
    name: Publish openlp-packaging release
    needs: [prepare-source, build-macos, build-windows]
    if: >-
      always()
      && needs.prepare-source.result == 'success'
      && needs.prepare-source.outputs.create_release == 'true'
      && needs.prepare-source.outputs.release_id != ''
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm-slim
    steps:
      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl jq ca-certificates

      - name: Finalise or discard draft release
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-source.outputs.release_id }}
          RELEASE_REPO: ${{ needs.prepare-source.outputs.release_repo }}
          RELEASE_EXISTED: ${{ needs.prepare-source.outputs.release_existed }}
          MACOS_RESULT: ${{ needs.build-macos.result }}
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
        run: |
          set -e
          ANY_SUCCESS=0
          for r in "$MACOS_RESULT" "$WINDOWS_RESULT"; do
            [ "$r" = "success" ] && ANY_SUCCESS=1
          done

          if [ "$RELEASE_EXISTED" = "true" ]; then
            echo "Release $RELEASE_ID already existed; leaving it untouched"
            exit 0
          fi

          if [ "$ANY_SUCCESS" = "0" ]; then
            echo "::warning::No builds succeeded - deleting draft release $RELEASE_ID"
            curl -fsSL -X DELETE \
              -H "Authorization: token ${CI_TOKEN}" \
              "${GITHUB_SERVER_URL}/api/v1/repos/${RELEASE_REPO}/releases/${RELEASE_ID}"
            exit 0
          fi

          echo "Publishing draft release $RELEASE_ID"
          curl -fsSL -X PATCH \
            -H "Authorization: token ${CI_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"draft":false}' \
            "${GITHUB_SERVER_URL}/api/v1/repos/${RELEASE_REPO}/releases/${RELEASE_ID}" \
            | jq -r '"Release URL: \(.html_url)"'
