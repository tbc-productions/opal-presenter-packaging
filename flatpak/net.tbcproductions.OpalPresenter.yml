app-id: net.tbcproductions.OpalPresenter
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
command: opal-presenter
build-options:
  env:
    PIP_IGNORE_INSTALLED: '1'
finish-args:
  - --socket=x11
  - --share=ipc
  - --device=dri
  - --share=network
  - --socket=pulseaudio
  - --filesystem=host
modules:
  - python3-requirements.json
  - python3-native-build.json
  - name: opal-generator-libxml2
    buildsystem: autotools
    config-opts:
      - --without-python
      - --disable-static
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libxml2/2.13/libxml2-2.13.9.tar.xz
        sha256: a2c9ae7b770da34860050c309f903221c67830c86e4a7e760692b803df95143a
  - name: OpalPresenter
    buildsystem: simple
    build-options:
      env:
        LLVM_INSTALL_DIR: /usr/lib/sdk/llvm22
        PIP_PREFIX: /app
        PIP_IGNORE_INSTALLED: '0'
    build-commands:
      - python3 scripts/build_fluentqt.py --qt-prefix qt/6.11.1/gcc_64 --source fluentqt --install
      - patchelf --set-rpath '$ORIGIN/../PySide6/Qt/lib' /app/lib/python3.14/site-packages/fluentqt/_fluentqt.so
      - mkdir -p /app/share/opal-presenter/i18n
      - cd resources/i18n; for file in *.ts; do /app/bin/pyside6-lconvert -i $file -o /app/share/opal-presenter/i18n/${file%%ts}qm
        ; done; cd ../..
      - pip install --no-deps --no-build-isolation --prefix=$FLATPAK_DEST .
      - mkdir -p /app/share/applications && cp resources/openlp.desktop /app/share/applications/net.tbcproductions.OpalPresenter.desktop
        && sed -ie s/Icon=opal-presenter/Icon=net.tbcproductions.OpalPresenter/ /app/share/applications/net.tbcproductions.OpalPresenter.desktop
      - mkdir -p /app/share/icons/hicolor/256x256/apps/ && cp resources/images/opal-presenter-logo-256x256.png
        /app/share/icons/hicolor/256x256/apps/net.tbcproductions.OpalPresenter.png
      - mkdir -p /app/share/icons/hicolor/1024x1024/apps/ && cp resources/images/opal-presenter-logo-1024x1024.png
        /app/share/icons/hicolor/1024x1024/apps/net.tbcproductions.OpalPresenter.png
      - install -Dm 644 -t /app/share/appdata/ net.tbcproductions.OpalPresenter.appdata.xml
    sources:
      - type: git
        url: https://github.com/tbc-productions/opal-presenter.git
        tag: 4.0.4
      - type: file
        path: net.tbcproductions.OpalPresenter.appdata.xml
      - type: dir
        path: qt
        dest: qt
      - type: git
        url: https://github.com/calvinhxx/Fluent-Qt.git
        commit: 227764dba3dcd33db393c7640a0d8642d89b1e38
        dest: fluentqt
